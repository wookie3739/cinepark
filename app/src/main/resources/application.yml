spring:
  config:
    import: optional:classpath:application-private.yml
  application:
    name: cinepark
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5400/cinepark}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: ${SMTP_TLS_REQUIRED:false}

server:
  port: 8000

cinepark:
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}
  tosspayments:
    secret-key: ${TOSSPAYMENTS_SECRET_KEY:}
    prepare-ttl-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health
