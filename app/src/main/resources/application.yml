spring:
  config:
    import: optional:classpath:application-private.yml
  application:
    name: cinepark
  # API JSON의 날짜·시각 표기 기본 타임존(Instant 등)
  jackson:
    time-zone: Asia/Seoul
  datasource:
    # 세션 TimeZone=Asia/Seoul: timestamptz 조회·표시 시 도구/드라이버가 한국 기준으로 맞추기 쉽다.
    # DB_URL 환경변수로 덮어쓸 때는 동일 옵션을 붙이는 것을 권장 (?options=-c%20TimeZone=Asia/Seoul)
    url: ${DB_URL:jdbc:postgresql://localhost:5400/cinepark?options=-c%20TimeZone=Asia/Seoul}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: ${SMTP_TLS_REQUIRED:false}

server:
  port: 8000

cinepark:
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}
  tosspayments:
    # 결제위젯 연동 시: 클라이언트의 test_gck_* 와 한 세트인 test_gsk_* (API 개별 연동 test_sk_* 와 혼용 불가)
    # 미설정 시 토스 문서 결제위젯 샘플 키(클라이언트 lib/tosspayments-client.ts 의 TOSS_PAYMENTS_CLIENT_KEY 와 짝)
    secret-key: ${TOSSPAYMENTS_SECRET_KEY}
    prepare-ttl-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health
